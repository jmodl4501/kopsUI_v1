server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/plain

spring:
  application:
    name: egov-portal
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/egov_portal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      max-lifetime: 1800000
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

logging:
  level:
    kr.go.egovportal: INFO
    org.mybatis: WARN
