server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,application/javascript,text/plain

spring:
  application:
    name: kops-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/kops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:kops}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      initialization-fail-timeout: -1   # DB 없이도 API 서버가 기동되도록 함
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

kops:
  cors:
    allowed-origins: ${KOPS_CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    kr.go.kops: INFO
    org.mybatis: WARN
